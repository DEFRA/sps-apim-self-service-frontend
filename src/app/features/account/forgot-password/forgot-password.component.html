<div class="govuk-grid-row">

  <div class="govuk-grid-column-two-thirds">

    <h1 class="govuk-heading-xl">
      Reset your password
    </h1>

    <p class="govuk-body">
      Enter the email address associated with
      your account.
    </p>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate>

      <div class="govuk-form-group">

        <label
          class="govuk-label"
          for="email">
          Email address
        </label>

        <input
          id="email"
          type="email"
          class="govuk-input govuk-input--width-30"
          formControlName="email">

      </div>

      <button
        type="submit"
        class="govuk-button">

        Continue

      </button>

    </form>

    <p class="govuk-body">

      <a
        class="govuk-link"
        routerLink="/login">

        Back to sign in

      </a>

    </p>

  </div>

</div>
