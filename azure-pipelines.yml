trigger:
  branches:
    include:
      - feature/Self-Serve-Portal

resources:
  repositories:
    - repository: DefraApiInfra
      type: git
      name: DEFRA-Common-Platform-Improvements/DEFRA-API-INFRA
      ref: refs/heads/feature/Self-Serve-Portal

jobs:
  - template: .azure-devops/angular-app-deploy.yaml@DefraApiInfra
    parameters:
      environment: dev2
      appDirectory: .
      buildOutputPath: dist
